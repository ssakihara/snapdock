name: SnapDock
options:
  bundleIdPrefix: com.ssakihara
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  SnapDock:
    type: application
    platform: macOS
    sources:
      - SnapDock
    info:
      path: SnapDock/Info.plist
      properties:
        CFBundleDisplayName: SnapDock
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "© 2026 ssakihara"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ssakihara.SnapDock
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
